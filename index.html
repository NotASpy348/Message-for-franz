<!DOCTYPE html>
<html>
<head>
    <style>
        @font-face {
            font-family: Mojangles;
            src: url("mojangles.ttf");
        }

        body {
            margin: 0;
            background: black;
            overflow: hidden;
            height: 100vh;
        }

        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            font-family: Mojangles;
            font-size: 30px;

            padding: 15px 30px;
            background: black;
            color: white;

            border: none;
            cursor: pointer;
        }

        #startButton:hover {
            background: #050505;
        }

        .text {
            position: absolute;
            left: -500px;

            color: white;
            font-family: Mojangles;
            font-size: 40px;

            white-space: nowrap;

            display: none;
        }

        #text1 {
            top: 10%;
        }
        #text2 {
            top: 20%;
        }
        #text3 {
            top: 30%;
        }
        #text4 {
            top: 40%;
        }
        #text5 {
            top: 50%;
        }
        #text6 {
            top: 60%;
        }

        .startAnimation1 {
            display: block;
            animation: move1 6s linear forwards;
        }
        .startAnimation2 {
            display: block;
            animation: move2 7s linear forwards;
        }
        .startAnimation3 {
            display: block;
            animation: move3 7s linear forwards;
        }
        .startAnimation4 {
            display: block;
            animation: move4 10s linear forwards;
        }
        .startAnimation5 {
            display: block;
            animation: move5 12s linear forwards;
        }
        .startAnimation6 {
            display: block;
            animation: move6 15s linear forwards;
        }

        @keyframes move1 {
            from {
                left: -500px;
            }

            to {
                left: 100%;
            }
        }
        @keyframes move2 {
            from {
                left: -500px;
            }

            to {
                left: 100%;
            }
        }
        @keyframes move3 {
            from {
                left: -500px;
            }

            to {
                left: 100%;
            }
        }
        @keyframes move4 {
            from {
                left: -500px;
            }

            to {
                left: 100%;
            }
        }
        @keyframes move5 {
            from {
                left: -500px;
            }

            to {
                left: 100%;
            }
        }
        @keyframes move6 {
            from {
                left: -500px;
            }

            to {
                left: 100%;
            }
        }

        .heart {
            position: absolute;
            left: -100px;

            color: navy;
            font-family: Mojangles;
            font-size: 25px;

            display: none;
            white-space: nowrap;
        }

        .heart1 {
            top: 10%;
            animation: heartMove1 5s linear infinite;
        }

        .heart2 {
            top: 25%;
            animation: heartMove2 8s linear infinite;
        }

        .heart3 {
            top: 50%;
            animation: heartMove3 4s linear infinite;
        }

        .heart4 {
            top: 75%;
            animation: heartMove4 10s linear infinite;
        }

        .heart5 {
            top: 90%;
            animation: heartMove5 6s linear infinite;
        }

        .heart6 {
            top: 33%;
            animation: heartMove6 12s linear infinite;
        }

        @keyframes heartMove1 {
            from {
                left: -100px;
            }

            to {
                left: 100%;
            }
        }

        @keyframes heartMove2 {
            from {
                left: -100px;
            }

            to {
                left: 100%;
            }
        }

        @keyframes heartMove3 {
            from {
                left: -100px;
            }

            to {
                left: 100%;
            }
        }

        @keyframes heartMove4 {
            from {
                left: -100px;
            }

            to {
                left: 100%;
            }
        }

        @keyframes heartMove5 {
            from {
                left: -100px;
            }

            to {
                left: 100%;
            }
        }

        @keyframes heartMove6 {
            from {
                left: -100px;
            }

            to {
                left: 100%;
            }
        }

        .showHeart {
            display: block;
        }
    </style>
</head>

<body>

    <button id="startButton">click me please ):</button>

    <div class="text" id="text1">i miss you a lot</div>
    <div class="text" id="text2">please come back</div>
    <div class="text" id="text3">i'm sorry, franz <3</div>
    <div class="text" id="text4">i won't leave you again</div>
    <div class="text" id="text5">i haven't told you this yet</div>
    <div class="text" id="text6">but i love you</div>

    <div class="heart heart1">&lt;3</div>
    <div class="heart heart2">&lt;3</div>
    <div class="heart heart3">&lt;3</div>
    <div class="heart heart4">&lt;3</div>
    <div class="heart heart5">&lt;3</div>
    <div class="heart heart6">&lt;3</div>

    <script>
        const button = document.getElementById("startButton");
        const text1 = document.getElementById("text1");
        const text2 = document.getElementById("text2");
        const text3 = document.getElementById("text3");
        const text4 = document.getElementById("text4");
        const text5 = document.getElementById("text5");
        const text6 = document.getElementById("text6");
        const hearts = document.querySelectorAll(".heart");

        button.addEventListener("click", function() {

            button.style.display = "none";

            text1.classList.add("startAnimation1");

            setTimeout(function() {
                text2.classList.add("startAnimation2");
            }, 2000);

            setTimeout(function() {
                text3.classList.add("startAnimation3");
            }, 4000);

            setTimeout(function() {
                text4.classList.add("startAnimation4");
            }, 6000);

            setTimeout(function() {
                text5.classList.add("startAnimation5");
            }, 8000);

            setTimeout(function() {
                text6.classList.add("startAnimation6");
            }, 10000);

            hearts.forEach(function(heart) {
                heart.classList.add("showHeart");
            });

        });
    </script>

</body>
</html>
